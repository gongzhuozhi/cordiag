[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cordiag"
version = "0.1.0"
description = "cordial diagnostic toolkit — zPG (z-score of Paired Gain) and TG (Transportability Gap) diagnostics for RNA→protein translation transferability across conditions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "[AUTHOR: 填写姓名]"}]
keywords = ["zPG", "transportability", "RNA-protein", "proteomics", "cross-condition", "bioinformatics", "diagnostic"]

dependencies = [
    "numpy>=1.24",
    # scipy pinned <1.18 on purpose: golden outputs (tg_bcm-only_v11.csv, tcga_validation.csv)
    # were generated on scipy 1.14.1; spearmanr/chi2_contingency behavior must stay
    # bit-identical for the golden regression suite (see package specification §5.3/§7.3).
    "scipy>=1.10,<1.18",
    "pandas>=1.5",
    "scikit-learn>=1.1",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
cordiag = "cordiag.cli:main"

[project.urls]
Homepage = "https://github.com/gongzhuozhi/cordiag"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
norecursedirs = ["_regression_output", "*.egg-info", "build", "dist"]
